name: backend-ci
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm test

# `migrate` / `check:rls` are deliberately NOT run here: the schema's
# `users.id references auth.users(id)` only exists on a real Supabase project
# (schema.md §4.1) — a plain `postgres:16` service container can't satisfy it,
# and there's no CI-provisioned Supabase instance (e.g. a preview branch) to
# migrate against instead. Re-add once one of those exists.
#
# `npm test` now includes real RLS integration tests (tests/integration/rls/)
# that run against the real Supabase project's 4 seeded test accounts — they
# have nothing to connect to here (no backend/.env, no secrets configured)
# and self-skip cleanly rather than fail (tests/globalSetup.js). They DO run
# for real whenever a dev with a working .env runs `npm test` locally.
