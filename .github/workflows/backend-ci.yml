name: backend-ci
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm test

# `migrate` / `check:rls` are deliberately NOT run here yet: the schema's
# `users.id references auth.users(id)` only exists on a real Supabase project
# (schema.md §4.1) — a plain `postgres:16` service container can't satisfy it,
# and there's no CI-provisioned Supabase instance (e.g. a preview branch) to
# migrate against instead. Re-add once one of those exists. Until then `npm
# test` only runs the `test.todo` placeholders in tests/ — see Memory.md
# "Row-Level Security" for the real, manually-run verification against the
# live project.
