# Local Postgres for backend integration + RLS tests (architecture.md §6).
# The real dev/staging/prod databases are managed Supabase projects — this is
# only a throwaway instance for `npm test`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mec_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
